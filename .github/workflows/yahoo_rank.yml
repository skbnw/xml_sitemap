# Yahoo!ニュース アクセスランキング
# Version: 1.1
# Last Update: 2026-10-31
#
# 変更履歴:
# - v1.1 (2026-10-31): Python 3.8 が Actions から消え、毎時の setup が即失敗していた。
#   checkout v4、setup-python v5、Python 3.11 にする。
# - v1.0: 毎時 rank.py を実行して CSV を push。

name: rank check

permissions:
  contents: write

on:
  schedule:
    - cron: '0 * * * *'  # 毎時00分に実行
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests beautifulsoup4 pytz boto3
      
      - name: Run scraper
        run: python py/rank.py  # スクリプトのパスを更新

      - name: Set Git Config
        run: |
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
        working-directory: ${{ github.workspace }}

      - name: Pull remote changes
        run: git pull origin main
        working-directory: ${{ github.workspace }}

      - name: Commit and push csv files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -- *_rank
            git commit -m "Update csv files - $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi
        working-directory: ${{ github.workspace }}
