# Yahoo 記事HTMLの日付指定取り込み
# Version: 1.1
# Last Update: 2026-10-31
#
# 変更履歴:
# - v1.1 (2026-10-31): Python 3.8 は Actions で見つからない。Python 3.11 にする。
# - v1.0: 手動実行で py/import by date.py を動かす。

name: 99_import by date

permissions:
  contents: write

on:
  workflow_dispatch:  # 手動実行を可能にする

jobs:
  run_import_by_date:
    runs-on: ubuntu-latest

    steps:
      # リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python環境をセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 必要なPythonライブラリをインストール
      - name: Install dependencies
        run: pip install pandas requests beautifulsoup4 pytz boto3

      # スクリプトを実行
      - name: Run import by date script
        run: python py/import\ by\ date.py

      # Gitの設定
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
        working-directory: ${{ github.workspace }}

      # 最新のリモート変更をプル
      - name: Pull latest changes
        run: git pull origin main
        working-directory: ${{ github.workspace }}

      # CSVファイルをコミット＆プッシュ
      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -- [0-9]*
            git commit -m "Update files - $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          else
            echo "No changes to commit"
          fi
        working-directory: ${{ github.workspace }}
