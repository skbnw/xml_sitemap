name: Fetch Reuters Japan sitemaps

on:
  workflow_dispatch:
  schedule:
    # 米東部時間 2:00AM ≒ 7:00 UTC
    - cron: "0 7 * * *"

jobs:
  fetch-reuters-jp-sitemaps:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-reuters-fetch.txt
          python -m playwright install --with-deps chromium

      - name: Fetch Reuters Japan sitemap XMLs (Playwright)
        env:
          # 任意: トンネル経由 CDP（未設定時は ubuntu 上の headless Chromium）
          CHROME_CDP_URL: ${{ secrets.REUTERS_CHROME_CDP_URL }}
        run: |
          set -eu
          TODAY="$(date -u +%Y%m%d)"
          echo "=== Fetching Reuters JP sitemaps for ${TODAY} (Playwright) ==="
          python scripts/fetch_reutersjp_sitemaps.py --date "${TODAY}"
          echo "=== Result ==="
          ls -la "rss_reutersjp_${TODAY}" || true

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -eu
          TODAY="$(date -u +%Y%m%d)"
          OUT="rss_reutersjp_${TODAY}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -d "${OUT}" ]; then
            echo "[ERROR] Output directory missing: ${OUT}"
            exit 1
          fi

          git add "${OUT}" || true

          if git diff --cached --quiet; then
            echo "[ERROR] No changes to commit (fetch likely failed silently)."
            exit 1
          fi

          git commit -m "Add Reuters Japan sitemaps and news sitemaps for ${TODAY}"
          git pull --rebase origin main
          git push
