# ジェトロ ビジネス短信
# Version: 1.0
# Last Update: 2026-10-26
#
# https://www.jetro.go.jp/rss2/biznews.xml は直近およそ20件しか持たない。
# 4時間ごとにスナップショットを残し、rss_jetro_YYYYMMDD へ保存する。
# ローカルへは daily_collection.bat が移す。

name: Fetch JETRO Biznews

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-jetro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch JETRO biznews RSS
        run: |
          set -eu
          TODAY=$(date -u +"%Y%m%d")
          HOUR=$(date -u +"%H")
          OUT_DIR="rss_jetro_${TODAY}"
          OUT_FILE="${OUT_DIR}/jetro_biznews_${TODAY}_${HOUR}.xml"
          mkdir -p "${OUT_DIR}"
          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
            -A "Mozilla/5.0" \
            "https://www.jetro.go.jp/rss2/biznews.xml" \
            -o "${OUT_FILE}"
          if ! grep -q "<item>" "${OUT_FILE}"; then
            echo "No RSS items in ${OUT_FILE}"
            exit 1
          fi
          echo "Saved ${OUT_FILE}"

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          TODAY=$(date -u +"%Y%m%d")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "rss_jetro_${TODAY}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add JETRO biznews RSS for ${TODAY}"
          for i in 1 2 3 4 5; do
            echo "Push attempt ${i}..."
            if git pull --rebase origin main && git push origin main; then
              echo "Push successful."
              exit 0
            fi
            sleep 5
          done
          echo "Failed to push after multiple attempts."
          exit 1
