# ジェトロ ビジネス短信
# Version: 1.1
# Last Update: 2026-10-26
#
# https://www.jetro.go.jp/rss2/biznews.xml は直近およそ20件しか持たない。
# 4時間ごとにRSS、記事JSON、政治経済日程JSONを rss_jetro_YYYYMMDD へ保存する。
# ローカルへは daily_collection.bat が移す。
#
# 変更履歴:
# - v1.1 (2026-10-26): 記事本文と世界の政治経済日程をJSONで保存。
# - v1.0 (2026-10-26): RSSスナップショットのみ。

name: Fetch JETRO Biznews

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-jetro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch JETRO articles and diary
        run: python py/fetch_jetro.py

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          TODAY=$(date -u +"%Y%m%d")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "rss_jetro_${TODAY}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add JETRO biznews JSON for ${TODAY}"
          for i in 1 2 3 4 5; do
            echo "Push attempt ${i}..."
            if git pull --rebase origin main && git push origin main; then
              echo "Push successful."
              exit 0
            fi
            sleep 5
          done
          echo "Failed to push after multiple attempts."
          exit 1
