# POLITICO RSS
# Version: 1.1
# Last Update: 2026-10-27
#
# 変更履歴:
# - v1.1 (2026-10-27): MorningEnergy と MorningShift は 404 のため対象外。
#   1本が失敗しても残りのフィードは保存し、1本も取れないときだけ失敗にする。
# - v1.0: 22本を取得。1本の 404 でジョブ全体が終了コード 22 になっていた。

name: Fetch POLITICO RSS

on:
  workflow_dispatch:
  # 米東部時間 2:00 AM 相当（冬 EST: UTC7）
  schedule:
    - cron: "0 7 * * *"

jobs:
  fetch-politico-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch POLITICO RSS feeds
        run: |
          set -eu

          # ---- 日付（YYYYMMDD, UTC基準）----
          TODAY=$(date -u +"%Y%m%d")

          # ---- 出力フォルダ（リポジトリ直下）----
          OUT_DIR="rss_politico_${TODAY}"
          mkdir -p "${OUT_DIR}"

          # ---- POLITICO RSS フィード一覧 ----
          declare -A FEEDS=(
            # Story Categories
            ["Congress"]="https://rss.politico.com/congress.xml"
            ["HealthCare"]="https://rss.politico.com/healthcare.xml"
            ["Defense"]="https://rss.politico.com/defense.xml"
            ["Economy"]="https://rss.politico.com/economy.xml"
            ["EnergyEnvironment"]="https://rss.politico.com/energy.xml"
            ["Politics"]="https://rss.politico.com/politics-news.xml"

            # Newsletters。morningenergy と morningshift は 2026-10-27 時点で 404。
            ["Playbook"]="https://rss.politico.com/playbook.xml"
            ["MorningTech"]="https://rss.politico.com/morningtech.xml"
            ["MorningMoney"]="https://rss.politico.com/morningmoney.xml"
            ["PoliticoPulse"]="https://rss.politico.com/politicopulse.xml"
            ["Huddle"]="https://rss.politico.com/huddle.xml"
            ["MorningDefense"]="https://rss.politico.com/morningdefense.xml"
            ["PoliticoInfluence"]="https://rss.politico.com/politicoinfluence.xml"
            ["MorningScore"]="https://rss.politico.com/morningscore.xml"
            ["MorningTransportation"]="https://rss.politico.com/morningtransportation.xml"
            ["MorningEducation"]="https://rss.politico.com/morningeducation.xml"
            ["MorningTax"]="https://rss.politico.com/morningtax.xml"
            ["MorningAgriculture"]="https://rss.politico.com/morningagriculture.xml"
            ["MorningCybersecurity"]="https://rss.politico.com/morningcybersecurity.xml"
            ["MorningTrade"]="https://rss.politico.com/morningtrade.xml"
          )

          echo "Fetching ${#FEEDS[@]} POLITICO RSS feeds..."
          saved=0

          for name in "${!FEEDS[@]}"; do
            url="${FEEDS[$name]}"
            out_file="${OUT_DIR}/rss_politico_${name}_${TODAY}.xml"

            echo "  - ${name}: ${url}"
            if curl -fsSL --retry 3 --retry-delay 2 -A "Mozilla/5.0" "${url}" -o "${out_file}" \
              && grep -q "<item>" "${out_file}"; then
              saved=$((saved + 1))
            else
              echo "  skipped ${name}"
              rm -f "${out_file}"
            fi
          done

          echo "Saved ${saved} feeds"
          if [ "${saved}" -eq 0 ]; then
            echo "No POLITICO feeds were saved."
            exit 1
          fi

          echo "Files created under: ${OUT_DIR}"
          ls -R "${OUT_DIR}"

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu

          TODAY=$(date -u +"%Y%m%d")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # その日の POLITICO フォルダをステージング
          git add "rss_politico_${TODAY}" || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add POLITICO RSS files for ${TODAY}"
            # リモートの最新状態を取得してリベース
            git pull --rebase origin main
            git push
          fi
