# AP見出しの取得
# Version: 1.1
# Last Update: 2026-10-26
#
# 変更履歴:
# - v1.1 (2026-10-26): apnews.com のサイトマップは Cloudflare で 403 のため、
#   AP公式FlipboardのRSS（トップ記事とアカウント全体）を rss_ap_YYYYMMDD に保存する。
# - v1.0: ap-sitemap.xml から月次サイトマップを取得。

name: Fetch AP Sitemaps

on:
  workflow_dispatch:
  schedule:
    # 米東部時間 2:00AM ＝ 7:00UTC
    - cron: "0 7 * * *"

# 同時に複数のジョブが走って競合するのを防ぐ設定
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-ap-sitemaps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 競合解決（rebase）を正常に行うため、履歴をすべて取得する
          fetch-depth: 0

      - name: Fetch AP headline RSS
        run: |
          set -eu

          TODAY=$(date -u +"%Y%m%d")

          OUT_DIR="rss_ap_${TODAY}"
          mkdir -p "${OUT_DIR}"

          # AP公式のFlipboard。apnews.com 直取りは 403 になるため使わない。
          declare -A FEEDS=(
            ["flipboard_top"]="https://flipboard.com/@associatedpress/top-stories-u7govdf1z.rss"
            ["flipboard_all"]="https://flipboard.com/@AssociatedPress.rss"
          )

          for name in "${!FEEDS[@]}"; do
            url="${FEEDS[$name]}"
            out_file="${OUT_DIR}/ap_${name}_${TODAY}.xml"
            echo "Fetching ${name}: ${url}"
            curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
              -A "Mozilla/5.0" \
              "${url}" -o "${out_file}"
            if ! grep -q "<item>" "${out_file}"; then
              echo "No RSS items in ${out_file}"
              exit 1
            fi
          done

          echo "Completed. Files under ${OUT_DIR}:"
          ls -R "${OUT_DIR}"

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu

          TODAY=$(date -u +"%Y%m%d")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "rss_ap_${TODAY}" || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add AP headline RSS for ${TODAY}"

          # 別のジョブとプッシュが重なった場合の競合解決ループ（最大5回）
          for i in {1..5}; do
            echo "Push attempt $i..."
            # リモートの最新を取り込んで自分のコミットを上に乗せる
            if git pull --rebase origin main && git push origin main; then
              echo "Push successful."
              exit 0
            else
              echo "Conflict or network error occurred. Retrying in 5 seconds..."
              sleep 5
            fi
          done

          echo "Failed to push after multiple attempts."
          exit 1
