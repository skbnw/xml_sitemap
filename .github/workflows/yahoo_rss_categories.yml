# Yahoo カテゴリ別RSS
# Version: 1.1
# Last Update: 2026-10-26
#
# https://news.yahoo.co.jp/rss/categories/*.xml は、そのカテゴリに掲載された最新約50件。
# 1時間ごとに xml-categories_YYYYMM_WW へ保存する。
# ローカルへは daily_collection.bat が 04_xml_categories へ移す。
#
# 変更履歴:
# - v1.1 (2026-10-26): 毎時20分に変更。取得失敗と空RSSでは終了コード 1。
#   変更があるときだけ commit し、push は rebase を最大5回試す。
# - v1.0: 毎日 03時台に毎分実行。y_rss_ctgry から xml_sitemap へ移した時点で未実行だった。

name: Fetch Yahoo Categories All RSS Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Yahoo category RSS
        run: |
          set -euo pipefail
          current_week=$(date -u +'%Y%m_%W')
          current_time=$(date -u +'%Y%m%d_%H%M')
          folder_name="xml-categories_${current_week}"
          mkdir -p "$folder_name"
          echo "CATEGORY_FOLDER=${folder_name}" >> "$GITHUB_ENV"
          for name in domestic world business entertainment sports it science life local; do
            out="${folder_name}/ctgry_${name}_${current_time}.xml"
            curl -fsSL --retry 3 --retry-delay 2 -A "Mozilla/5.0" \
              -o "$out" "https://news.yahoo.co.jp/rss/categories/${name}.xml"
            grep -q "<item>" "$out"
          done

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "xml-categories_"*
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Yahoo category RSS"
          for i in 1 2 3 4 5; do
            echo "Push attempt ${i}..."
            if git pull --rebase origin main && git push origin main; then
              echo "Push successful."
              exit 0
            fi
            sleep 5
          done
          echo "Failed to push after multiple attempts."
          exit 1
